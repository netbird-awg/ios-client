name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build_ios:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: Checkout ios-client
        uses: actions/checkout@v4
        with:
          path: ios-client
          submodules: recursive

      - name: Get netbird-core commit
        id: core-sha
        working-directory: ios-client
        run: echo "sha=$(git rev-parse HEAD:netbird-core)" >> "$GITHUB_OUTPUT"

      - name: Cache NetBirdSDK xcframework
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ios-client/NetBirdSDK.xcframework
          # gomobile/xcode segments must match the pinned versions in this job
          key: netbirdsdk-ios-${{ steps.core-sha.outputs.sha }}-${{ hashFiles('ios-client/build-go-lib.sh') }}-gomobile-20251113184115-xcode-26.1.1

      - name: Fetch netbird tags
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ios-client/netbird-core
        run: git fetch --tags

      - name: Setup Go
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'ios-client/netbird-core/go.mod'
          cache-dependency-path: ios-client/netbird-core/go.sum

      - name: Install gomobile
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20251113184115-a159579294ab

      - name: Build NetBirdSDK xcframework
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ios-client
        run: ./build-go-lib.sh

      - name: Install xcpretty
        working-directory: ios-client
        run: gem install xcpretty

      - name: Create dummy GoogleService-Info.plist
        working-directory: ios-client
        run: |
          cat > GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>dummy</string>
            <key>API_KEY</key>
            <string>dummy</string>
            <key>GCM_SENDER_ID</key>
            <string>dummy</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>io.netbird.awg.client</string>
            <key>PROJECT_ID</key>
            <string>dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>dummy</string>
          </dict>
          </plist>
          EOF

      - name: Resolve Swift packages
        working-directory: ios-client
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NetBird.xcodeproj \
            -scheme NetBird \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios"

      - name: Build iOS App
        working-directory: ios-client
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("MARKETING_VERSION=${VERSION%%-*}" "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}")
          fi
          xcodebuild build \
            -project NetBird.xcodeproj \
            -scheme NetBird \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            | xcpretty --color

      - name: Build Network Extension
        working-directory: ios-client
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("MARKETING_VERSION=${VERSION%%-*}" "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}")
          fi
          xcodebuild build \
            -project NetBird.xcodeproj \
            -scheme NetbirdNetworkExtension \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            | xcpretty --color

      - name: Build Widget Extension
        working-directory: ios-client
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("MARKETING_VERSION=${VERSION%%-*}" "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}")
          fi
          xcodebuild build \
            -project NetBird.xcodeproj \
            -scheme NetBirdWidgetExtensionExtension \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            | xcpretty --color

      - name: Package unsigned iOS app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP="$RUNNER_TEMP/DerivedData-ios/Build/Products/Debug-iphoneos/NetBird-AWG.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/netbird-awg-ios-${GITHUB_REF_NAME}-unsigned.zip"

      - name: Upload unsigned iOS app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: netbird-awg-ios
          path: ${{ runner.temp }}/netbird-awg-ios-${{ github.ref_name }}-unsigned.zip
          if-no-files-found: error

  build_tvos:
    name: Build tvOS App
    runs-on: macos-15

    steps:
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app/Contents/Developer

      - name: Checkout ios-client
        uses: actions/checkout@v4
        with:
          path: ios-client
          submodules: recursive

      - name: Get netbird-core commit
        id: core-sha
        working-directory: ios-client
        run: echo "sha=$(git rev-parse HEAD:netbird-core)" >> "$GITHUB_OUTPUT"

      - name: Cache NetBirdSDK xcframework
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ios-client/NetBirdSDK.xcframework
          # gomobile/xcode segments must match the pinned versions in this job
          key: netbirdsdk-tvos-${{ steps.core-sha.outputs.sha }}-${{ hashFiles('ios-client/build-go-lib.sh') }}-gomobile-fork-20260129172842-xcode-26.1.1

      - name: Fetch netbird tags
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ios-client/netbird-core
        run: git fetch --tags

      - name: Setup Go
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: 'ios-client/netbird-core/go.mod'
          cache-dependency-path: ios-client/netbird-core/go.sum

      - name: Install gomobile-netbird (tvOS fork)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          GOPROXY=direct go install github.com/netbirdio/gomobile-tvos-fork/cmd/gomobile-netbird@v0.0.0-20260129172842-a56582c0e7c9
          GOPROXY=direct go install github.com/netbirdio/gomobile-tvos-fork/cmd/gobind-netbird@v0.0.0-20260129172842-a56582c0e7c9

      - name: Build NetBirdSDK xcframework
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: ios-client
        run: ./build-go-lib.sh --tvos

      - name: Install xcpretty
        working-directory: ios-client
        run: gem install xcpretty

      - name: Create dummy GoogleService-Info.plist
        working-directory: ios-client
        run: |
          cat > GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CLIENT_ID</key>
            <string>dummy</string>
            <key>REVERSED_CLIENT_ID</key>
            <string>dummy</string>
            <key>API_KEY</key>
            <string>dummy</string>
            <key>GCM_SENDER_ID</key>
            <string>dummy</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>io.netbird.awg.client</string>
            <key>PROJECT_ID</key>
            <string>dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>dummy</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <false/>
            <key>IS_GCM_ENABLED</key>
            <false/>
            <key>GOOGLE_APP_ID</key>
            <string>dummy</string>
          </dict>
          </plist>
          EOF

      - name: Resolve Swift packages
        working-directory: ios-client
        run: |
          xcodebuild -resolvePackageDependencies \
            -project NetBird.xcodeproj \
            -scheme "NetBird TV" \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tvos"

      - name: Build tvOS App
        working-directory: ios-client
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("MARKETING_VERSION=${VERSION%%-*}" "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}")
          fi
          xcodebuild build \
            -project NetBird.xcodeproj \
            -scheme "NetBird TV" \
            -destination 'generic/platform=tvOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tvos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            | xcpretty --color

      - name: Build tvOS Network Extension
        working-directory: ios-client
        run: |
          set -o pipefail
          VERSION_ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION_ARGS=("MARKETING_VERSION=${VERSION%%-*}" "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}")
          fi
          xcodebuild build \
            -project NetBird.xcodeproj \
            -scheme "NetBirdTVNetworkExtension" \
            -destination 'generic/platform=tvOS' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-tvos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "${VERSION_ARGS[@]}" \
            | xcpretty --color

      - name: Package unsigned tvOS app
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APP="$RUNNER_TEMP/DerivedData-tvos/Build/Products/Debug-appletvos/NetBird-AWG.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" \
            "$RUNNER_TEMP/netbird-awg-tvos-${GITHUB_REF_NAME}-unsigned.zip"

      - name: Upload unsigned tvOS app
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: netbird-awg-tvos
          path: ${{ runner.temp }}/netbird-awg-tvos-${{ github.ref_name }}-unsigned.zip
          if-no-files-found: error

  github_release:
    name: Publish GitHub prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_ios, build_tvos]
    runs-on: ubuntu-latest
    steps:
      - name: Download client artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: netbird-awg-*
          path: release-assets
          merge-multiple: true

      - name: Publish unsigned Apple clients
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NetBird-AWG Apple clients ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          body: |
            AWG-enabled unsigned iOS and tvOS device builds.

            Apple signing credentials are not stored in this repository.
            Re-sign these app bundles with the matching App IDs, App Groups,
            and provisioning profiles before installing them on physical devices.
          files: release-assets/*
